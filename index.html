header div:has(> #search){width:100%;margin-left:0!important}
header #search{width:100%!important;min-width:0!important}
main select{min-width:0!important;max-width:100%}
input,select,textarea,input[class],select[class],textarea[class]{font-size:16px!important}
[class*="-translate-x-1/2"]{max-width:calc(100vw - 24px)}
.cdv-ov,.cdd-ov{padding:8px!important}
.cdd-bd{padding:8px 16px 20px!important;gap:16px!important}
.cdd-pn,.cdv-pn{max-width:100%!important}
.cdv-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}
.cdv-card{border-radius:10px!important}
.cdv-cb{padding:6px 6px 8px!important;gap:2px!important}
.cdv-card .font-mono-tabular{font-size:9.5px!important}
.cdv-card .font-serif{font-size:12px!important;line-height:1.15!important;overflow-wrap:anywhere}
.cdv-t{font-size:10.5px!important;line-height:1.25!important;overflow-wrap:anywhere}
.cdv-cr{padding-top:3px!important;gap:4px!important}
.cdv-cr>:not([data-status-pill]){display:none!important}
.cdv-cr>[data-status-pill]{max-width:100%;padding:2px 6px!important;font-size:9.5px!important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdv-tw th,.cdv-tw td{padding:8px 5px!important;font-size:12px!important}
}
</style>
<style id="cd-desktop-cards">
@media (min-width:768px){
.cdv-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:12px!important}
}
@media (min-width:1024px){
.cdv-grid{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:12px!important}
.cdv-card{border-radius:12px!important}
.cdv-cb{padding:8px 9px 10px!important;gap:3px!important}
.cdv-card .font-mono-tabular{font-size:10.5px!important}
.cdv-card .font-serif{font-size:14px!important;line-height:1.2!important;overflow-wrap:anywhere}
.cdv-t{font-size:12px!important;line-height:1.3!important;overflow-wrap:anywhere}
.cdv-cr{padding-top:4px!important;gap:5px!important}
.cdv-cr>[data-status-pill]{padding:2px 8px!important;font-size:10.5px!important}
.cdv-cr>span{font-size:11px!important}
}
</style>
<style id="cd-mobile-list">
@media (max-width:767px){
.cdv-lg{gap:6px!important}
.cdv-li{padding:8px 10px!important;border-radius:10px!important;box-shadow:none!important}
.cdv-li>div:first-child{gap:10px!important;align-items:center!important}
.cdv-li>div:first-child>button:not(.cd-thumb),.cdv-li>div:first-child .rounded-full{display:none!important}
.cdv-li .cd-thumb{display:flex!important;width:44px!important;height:44px!important;flex:none!important}
.cdv-li>div:first-child>div:last-child>div:first-child{font-size:10.5px!important;line-height:1.2!important}
.cdv-li .font-serif{font-size:14px!important;line-height:1.2!important;margin-top:1px!important}
.cdv-li .cdv-lt{font-size:12px!important;line-height:1.25!important;margin-top:0!important}
.cdv-li .font-serif,.cdv-li .cdv-lt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdv-li>div:nth-child(2){margin-top:6px!important;gap:4px!important}
.cdv-li>div:nth-child(2)>*{padding:2px 7px!important;font-size:11px!important}
.cdv-li>div:nth-child(2)>span[title]{display:none!important}
.cdv-li>div:nth-child(n+3){display:none!important}
}
</style>

<style id="cd-no-select">
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img{-webkit-user-drag:none;user-drag:none}
</style>
<style id="cd-perf">
@supports (height:100dvh){
.min-h-screen{min-height:100dvh}
.max-h-\[88vh\]{max-height:88dvh}
.max-h-\[75vh\]{max-height:75dvh}
body .cdv-ov .cdv-pn,body .cdd-ov .cdd-pn{max-height:90dvh}
}
.cdv-pn,.cdd-pn,.cdv-ov,.cdd-ov{overscroll-behavior:contain}

@media (max-width:767px){
.backdrop-blur-xl{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.backdrop-blur-\[6px\],body .cdv-ov,body .cdd-ov{-webkit-backdrop-filter:none;backdrop-filter:none}
}
</style>
<style id="cd-ipad-overlay">
.cdd-ov,.cdv-ov{top:0;left:0;right:0;bottom:0}
@media (hover:none) and (pointer:coarse){
.cdd-ov,.cdv-ov,.modal-overlay,[class*="backdrop-blur-["],[style*="backdrop-filter"]{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
}
</style>
<style id="cd-list-num">
.cdv-num{flex:none;min-width:3ch;text-align:right;align-self:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:11px;color:var(--text-ter)}
@media (max-width:767px){.cdv-li>div:first-child{gap:8px!important}}
</style>
